# pr-failure-analysis.yml
#
# Triggers on every pull request against main.
# Job 1 (build-and-test): your real CI. Intentionally fails for demo.
# Job 2 (analyze-failure): runs only on failure — clones the analyzer
#   repo, downloads the log, runs Gemini, posts fix as a PR comment.
#
# Secrets required (repo Settings → Secrets and Variables → Actions):
#   GEMINI_API_KEY  — Google AI Studio key (free tier)
#   GITHUB_TOKEN    — auto-provided by GitHub Actions (no setup needed)

name: PR CI + Failure Analysis

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: write
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1 — Real CI (intentional failure for demo)
  # ─────────────────────────────────────────────────────────────────
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Intentional failure — missing module
        run: python -c "import non_existent_module"

  # ─────────────────────────────────────────────────────────────────
  # Job 2 — Analyze the failure and post PR comment
  # ─────────────────────────────────────────────────────────────────
  analyze-failure:
    name: Analyze CI Failure
    runs-on: ubuntu-latest
    needs: build-and-test
    if: failure()

    steps:
      # Step 1: Clone the analyzer repo — files live at the repo root (no subdir)
      - name: Clone CI Log Analyzer
        run: |
          git clone https://github.com/JinilShukla/ci-log-analyzer.git analyzer
          pip install -r analyzer/requirements.txt

      # Step 2: Download the failed job log using GitHub API
      - name: Download failed job logs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd analyzer
          python3 downloader.py \
            --repo "${{ github.repository }}" \
            --run_id "${{ github.run_id }}"

      # Step 3: Find the log file we just downloaded
      - name: Find log file
        id: find_log
        run: |
          LOG=$(find analyzer/logs/${{ github.run_id }} \
            -name "build-and-test_*.txt" | head -1)
          echo "log_file=$LOG" >> $GITHUB_OUTPUT
          echo "Found: $LOG"

      # Step 4: Run LLM analysis — outputs record ID to stdout
      - name: Run LLM analysis
        id: analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd analyzer
          python3 analyzer.py \
            --input    "../${{ steps.find_log.outputs.log_file }}" \
            --repo     "${{ github.repository }}" \
            --run_id   "${{ github.run_id }}" \
            --job_name "build-and-test" \
            --branch   "${{ github.head_ref }}" \
            --pr_number "${{ github.event.pull_request.number }}" \
            | tee /tmp/analysis_output.txt

          # Match exactly the "Saved as FailureRecord ID: fail-XXXXXXXX" line
          RECORD_ID=$(grep "Saved as FailureRecord ID:" /tmp/analysis_output.txt \
            | awk '{print $NF}' | tr -d '[:space:]')
          echo "record_id=$RECORD_ID" >> $GITHUB_OUTPUT
          echo "Record ID extracted: $RECORD_ID"

      # Step 5: Post the analysis as a PR comment
      - name: Post PR comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd analyzer
          python3 pr_commenter.py \
            --repo      "${{ github.repository }}" \
            --pr        "${{ github.event.pull_request.number }}" \
            --record-id "${{ steps.analysis.outputs.record_id }}" \
            --clean
